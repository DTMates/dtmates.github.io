name: Publish Web Studio V26
on:
  push:
    branches: [main]
    paths:
      - 'web-studio-v26/**'
      - '.github/workflows/web-studio-v26-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify V26 hashes and preserve every prior release
        run: |
          test -s app-ads.txt
          for v in 20 21 22 23 24 25; do test -s web-studio-v$v/index.html; done
          node --input-type=module <<'JS'
          import {readFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          const m=JSON.parse(await readFile('web-studio-v26/manifest.json'));
          if(m.version!==26)throw Error('Wrong release');
          if(JSON.stringify(m.locales)!==JSON.stringify(['cs','en']))throw Error('Wrong primary locales');
          for(const f of m.files){const bytes=await readFile('web-studio-v26/'+f.path);if(bytes.length!==f.bytes||createHash('sha256').update(bytes).digest('hex')!==f.sha256)throw Error(f.path)}
          console.log(m.files.length+' exact V26 file hashes');
          JS
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Wait for uploaded artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 12); do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '[.artifacts[] | select(.name == "github-pages")] | length')
            if [ "$count" -gt 0 ]; then exit 0; fi
            sleep 5
          done
          echo "Pages artifact metadata did not become available" >&2
          exit 1
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Independently verify V26 and retained public routes
        run: |
          set -eu
          BASE=https://dtmates.github.io/web-studio-v26
          for route in / /v26.css /presentation.js /creator-model.js /creator-ui.js /app-model.js /app-runtime.js /app-creator.js /requirements.js /manifest.json; do curl -fsSL --retry 8 --retry-all-errors --retry-delay 5 --max-time 30 "$BASE$route" >/dev/null; done
          for lang in cs en; do
            for route in / /projects.html /builder.html /case/fashion.html /app-creator.html /app-demo.html /case/agile.html /case/pawmaster.html /services.html /pricing.html /delivery.html /process.html /contact.html /privacy.html; do curl -fsSL "$BASE/$lang$route" >/dev/null; done
          done
          for lang in cs en de sk pl fr es ar; do curl -fsSL "$BASE/agile/$lang/" >/dev/null; done
          for site in cafe blackline hotel wellness realty electric dental bloom timo signal; do curl -fsSL "$BASE/engine/sites/$site/" >/dev/null; done
          for v in 20 21 22 23 24 25; do curl -fsSL https://dtmates.github.io/web-studio-v$v/ >/dev/null; done
          curl -fsSL https://dtmates.github.io/app-ads.txt >/dev/null
