<g transform="translate(793 344)">
<circle r="13" fill="#d6e4e0"/>
<path d="M-2 -8C-7 -73 -16 -181 3 -249C14 -249 18 -238 17 -218L12 -10Z" fill="url(#turbine)"/>
<path d="M10 4C69 28 163 81 206 132c-5 10-19 10-35 0L0 13Z" fill="url(#turbine)"/>
<path d="M-9 7C-57 44-142 104-207 115c-6-11 3-24 20-34L-1-8Z" fill="url(#turbine)"/>
<circle r="13" fill="#e8f0e9"/>
</g>
<!-- Distant turbines -->
