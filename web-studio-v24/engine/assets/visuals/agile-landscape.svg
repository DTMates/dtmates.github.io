<path d="M-6 0L-14 275H14L6 0" fill="#c8d8d5"/>
<g><path d="M-3 0L-8 -176C6 -182 11-171 9-158L8-2Z" fill="#d7e8df"/><path d="M5 3L151 102C149 114 138 117 127 107L-1 12Z" fill="#d7e8df"/><path d="M-8 8L-155 96C-164 88-159 77-146 72L-2-11Z" fill="#d7e8df"/></g><circle r="9" fill="#eff6ec"/>
</g>
