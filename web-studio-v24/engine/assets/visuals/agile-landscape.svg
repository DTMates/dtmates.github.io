<g><path d="M-3 -3L-6 -177C7-182 12-173 10-159L6-1Z" fill="#e0ece7"/><path d="M6 3L151 101C147 112 138 113 127 106L-2 10Z" fill="#e0ece7"/><path d="M-8 8L-154 96C-161 85-157 78-145 70L-2-10Z" fill="#e0ece7"/></g><circle r="9" fill="#eff6ec"/>
</g>
</g>
<path d="M0 725c210-88 317-45 445 0 134 46 317-37 438-30 115 6 198 25 317-19v94H0Z" fill="#28524b" opacity=".45"/>
