<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 770" role="img" aria-labelledby="title desc">
<title id="title">Energy transition landscape</title>
<desc id="desc">Original illustrative energy landscape with rolling hills and wind turbines. No people or photographic portraits.</desc>
<defs>
<linearGradient id="sky" x1="0" y1="0" x2=".62" y2="1"><stop stop-color="#244d62"/><stop offset=".4" stop-color="#77a7bb"/><stop offset=".85" stop-color="#d4bf94"/><stop offset="1" stop-color="#d4b483"/></linearGradient>
<radialGradient id="sun"><stop stop-color="#fbe6bd" stop-opacity=".95"/><stop offset=".4" stop-color="#eec995" stop-opacity=".35"/><stop offset="1" stop-color="#eebc82" stop-opacity="0"/></radialGradient>
<linearGradient id="foreground" x1="0" x2=".4" y1="0" y2="1"><stop stop-color="#637e5b"/><stop offset=".5" stop-color="#426958"/><stop offset="1" stop-color="#294e49"/></linearGradient>
<linearGradient id="turbine" x1="0" y1="0" x2="1" y2=".4"><stop stop-color="#f9fcf7"/><stop offset=".55" stop-color="#bcd6d1"/><stop offset="1" stop-color="#688f8b"/></linearGradient>
<filter id="blur"><feGaussianBlur stdDeviation="16"/></filter>
<filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="3" dy="7" stdDeviation="7" flood-color="#1d3944" flood-opacity=".4"/></filter>
</defs>
<rect width="1200" height="770" fill="url(#sky)"/>
<ellipse cx="814" cy="237" rx="295" ry="240" fill="url(#sun)"/>
<g opacity=".26" fill="#e7e0c3"><ellipse cx="190" cy="180" rx="150" ry="20" filter="url(#blur)"/><ellipse cx="610" cy="125" rx="130" ry="18" filter="url(#blur)"/></g>
<path d="M0 432C102 374 182 369 278 415S484 457 593 401s223-54 331-21 202 21 276-16v245H0Z" fill="#77928c" opacity=".74"/>
<path d="M0 486C149 414 215 448 332 462S544 416 634 431s174 68 282 42 183-54 284-27v220H0Z" fill="#537d75" opacity=".82"/>
<path d="M0 564C124 491 225 481 372 526c112 33 207 15 304-18 113-38 241-25 332 18 79 37 133 10 192-7v251H0Z" fill="url(#foreground)"/>
<g opacity=".34"><path d="M0 670C216 604 337 623 523 662s398-30 677-26" stroke="#d8cb91" stroke-width="19" fill="none"/><path d="M0 702C175 657 366 683 562 701s424-21 638-5" stroke="#9baf7c" stroke-width="10" fill="none"/></g>
<g filter="url(#shadow)">
<!-- Large foreground turbine -->
